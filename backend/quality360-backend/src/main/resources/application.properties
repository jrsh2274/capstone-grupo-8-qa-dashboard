spring.application.name=quality360-backend
# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/quality360
spring.datasource.username=quality360_app
spring.datasource.password=${QUALITY360_DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=quality360
spring.jpa.open-in-view=false

# Desarrollo
spring.jpa.show-sql=true

# Servidor
server.port=8080